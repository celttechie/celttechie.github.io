site_name: Brian Jarrett | Solutions Architecture & Technical Leadership
site_description: Personal portfolio and technical blog of Brian Jarrett.
site_author: Brian Jarrett
site_url: https://celttechie.github.io/

theme:
  name: material
  font:
    text: Inter
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Articles:
      - Technical Execution & Rapid Learning: articles/technical_execution_and_rapid_learning.md
      - From Bare Metal to vLLM (OpenShift AI): articles/from_bare_metal_to_vllm_openshift_ai.md
  - Resumes: resumes.md
  - 2014 Site Archive: legacy_archive.md

extra:
  analytics:
    provider: google
    property: G-X4214GV2B0

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
