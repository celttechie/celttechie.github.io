- id: innovation_lab
  category: "Personal R&D & Systems Architecture"
  title: "The Innovation Lab (Personal R&D)"
  dates_display: "Ongoing"
  summary: >-
    Continuous hands-on research and prototyping environment focusing on cloud-native infrastructure,
    air-gapped delivery platforms, sovereign AI orchestration, and data pipeline engineering on dedicated
    workstation infrastructure.
  skills:
    - gpu_ai_infra
    - k8s_openshift_platform
    - ai_serving_sre
    - ai_rag_mlops
    - python
    - databases
    - etl_pipelines
    - linux_systems
    - fedramp_stig
    - ha_clustering
    - root_cause_diagnostics
  projects:
    - id: openshift_ai_infra
      title: "OpenShift & Kubernetes AI Infrastructure (openshift-ai-infrastructure)"
      description: "Hands-on research and applied SRE platform for enterprise AI stacks, bridging bare-metal hardware and Kubernetes. Engineered host PCIe VFIO passthrough and IOMMU isolation for NVIDIA GPU acceleration, deployed the NVIDIA GPU Operator with CRI-O Container Device Interface (CDI) and time-slicing multi-tenancy, and orchestrated production OpenAI-compatible vLLM inference (PagedAttention, continuous batching) alongside KServe/RHOAI declarative overlays. Formulated Day-2 SRE operational runbooks (PCIe bus reset, node drain), DCGM/Prometheus alerting for KV-cache and P95 latency, and incident post-mortems."
      skills:
        [
          "gpu_ai_infra",
          "k8s_openshift_platform",
          "ai_serving_sre",
          "linux_systems",
          "ha_clustering",
          "root_cause_diagnostics",
        ]

    - id: openshift_sno_lab
      title: "Single-Node OpenShift Platform Substrate (openshift-sno-lab)"
      description: "Architected an automated, declarative infrastructure substrate deploying Single Node OpenShift (SNO 4.16+) via OpenTofu and KVM/libvirt, establishing strict separation of concerns between infrastructure provisioning and AI workloads. Implemented a flat peer-bastion topology (split-DNS, HAProxy ingress) and dedicated isolated bridge (virbr-ocp) ensuring zero host collision; tuned NVMe PCIe storage pools (cache=none, io=threads) to guarantee sub-10ms etcd fsync latency. Enforced zero-trust SSH with native OpenTofu Ed25519 deterministic key pinning and authored declarative RHCOS MachineConfigs for boot-time 1GB HugePages and kernel IOMMU passthrough."
      skills:
        [
          "k8s_openshift_platform",
          "linux_systems",
          "ha_clustering",
          "root_cause_diagnostics",
        ]

    - id: tactical_edge_gateway
      title: "Tactical Edge Telemetry Gateway (tactical-edge-gateway)"
      description: "Architected an air-gapped telemetry translation and operator situational awareness gateway bridging autonomous robotics protocols (**MAVLink and ROS2/DDS**) to military C2 (**Cursor on Target / TAK Server**) over contested DDIL links. Authored Architecture Decision Records (ADRs) and threat models, packaging services as zero-dependency **Zarf OCI artifacts** with continuous **Lula (OSCAL)** compliance validation."
      skills:
        ["fedramp_stig", "linux_systems", "python", "solutions_architecture"]

    - id: tactical_edge_sdn
      title: "Tactical Edge Software-Defined Networking (tactical-edge-sdn)"
      description: "Engineered a cloud-native software-defined networking reference architecture modernizing edge and shipboard tactical routing. Features an autonomous Python/C++ SD-WAN controller that evaluates latency and packet loss across simulated radio links, mutating Linux Netlink kernel routes dynamically with zero dropped sessions, packaged with containerized FRRouting and WireGuard as Zarf packages."
      skills: ["network_security", "linux_systems", "ha_clustering", "python"]

    - id: airgap_defense_unicorns
      title: "Air-Gapped Delivery & cATO Prototyping (Defense Unicorns Zarf/UDS/Lula)"
      description: "Evaluated declarative air-gapped platform delivery using **Defense Unicorns' Zarf** and **UDS bundles**. Integrated **Lula** with **OSCAL** schemas to validate live Kubernetes resources against NIST SP 800-53 security controls, automating the generation of compliance artifacts and System Security Plans (SSPs)."
      skills: ["fedramp_stig", "linux_systems"]

    - id: immutable_k8s_talos
      title: "Immutable Kubernetes Infrastructure (Talos Linux & eBPF Cilium)"
      description: "Engineered an immutable, declarative Kubernetes control plane using **Talos Linux** (API-managed, read-only rootfs, zero-SSH attack surface). Configured **eBPF-powered Cilium** for high-performance socket routing, L2 BGP load balancing, and observability."
      skills: ["linux_systems", "ha_clustering"]

    - id: iac_sandboxing
      title: "Automated Sandbox Substrates & Deterministic Security (OpenTofu & Libvirt)"
      description: "Built automated multi-tier sandbox topologies replicating isolated network zones and jump hosts using **OpenTofu** on KVM/Libvirt. Authored architectural standards for deterministic SSH host key generation to eliminate security anti-patterns in ephemeral testing."
      skills: ["linux_systems", "root_cause_diagnostics"]

    - id: ai_orchestration
      title: "Multi-Agent AI Orchestration & MLOps"
      description: "Engineered a private, server-grade AI orchestration stack using **LiteLLM** and **Hermes** on a dedicated T5600 workstation (128GB RAM/RTX 3060)."
      skills: ["ai_rag_mlops", "linux_systems"]

    - id: rag_knowledge
      title: "Knowledge Retrieval & Vector Search"
      description: "Implemented a **RAG (Retrieval-Augmented Generation)** pipeline utilizing **Qdrant** as a vector database to enable natural language querying across a multi-terabyte technical knowledge base."
      skills: ["ai_rag_mlops", "etl_pipelines"]

    - id: graph_analytics
      title: "Graph Analytics & Entity Mapping"
      description: "Utilizing **Graphifyy** to engineer complex network graphs for relationship mapping, entity extraction, and knowledge discovery."
      skills: ["ai_rag_mlops", "python"]

    - id: clustering_research
      title: "Statistical Research & Graph Clustering"
      description: "Exploring advanced community detection and data clustering using the **Leiden algorithm** to derive structural insights from unstructured datasets."
      skills: ["ai_rag_mlops", "python"]

