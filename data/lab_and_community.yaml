    - id: robotics_diagnostics
      title: "Methodical Diagnostic Methodology"
      description: "Training students in systematic root-cause troubleshooting for electrical, software, and mechanical subsystems to rapidly diagnose and resolve failure points during active competition."
      skills: ["robotics_mentoring", "root_cause_diagnostics"]

    - id: robotics_leadership
      title: "Engineering Collaboration & Leadership"
      description: "Guiding students through the iterative engineering design process, technical documentation, design reviews, and collaborative problem solving."
      skills: ["robotics_mentoring", "technical_leadership"]
